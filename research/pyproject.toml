[project]
name = "quiver-riemann-retrieval-research"
version = "0.1.0"
description = "QuIVer 黎曼几何与条件化向量检索实验环境"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets>=3.6,<5",
  "geoopt>=0.5.1,<0.6",
  "matplotlib>=3.10,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pypdf>=5,<7",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "sentence-transformers>=4.1,<6",
  "torch>=2.6,<3",
  "tqdm>=4.67,<5",
]

[dependency-groups]
dev = [
  "jupyterlab>=4.3,<5",
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riemann_retrieval"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
